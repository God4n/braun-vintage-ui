
<script>
/* Documentation site runtime: language, hash routes, code tabs, copy, swatches, theme.
   Nothing here is needed by the components themselves. */
(function () {
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const root = document.documentElement;
  const ES = window.DX_ES || {};
  const UI = {
    en: { preview: 'Preview', copy: 'Copy', copied: 'Copied', prev: '← Previous', next: 'Next →', dark: 'Dark mode', light: 'Light mode', uses: 'Also uses the CSS of', lightVal: 'light', darkVal: 'dark', copyVar: 'Copy' },
    es: { preview: 'Vista previa', copy: 'Copiar', copied: 'Copiado', prev: '← Anterior', next: 'Siguiente →', dark: 'Modo oscuro', light: 'Modo claro', uses: 'Usa también el CSS de', lightVal: 'claro', darkVal: 'oscuro', copyVar: 'Copiar' }
  };
  let lang = 'en';
  try { lang = localStorage.getItem('dx-lang') === 'es' ? 'es' : 'en'; } catch (e) {}
  const t = key => UI[lang][key];

  const views = $$('.dx-view'), links = $$('#dx-rail a'), rail = document.getElementById('dx-rail');
  const pager = document.getElementById('dx-pager'), scale = document.getElementById('dx-scale'), menuBtn = document.getElementById('dx-menu');
  const linkOf = name => links.find(a => a.hash === '#' + name);
  const labelOf = name => { const a = linkOf(name); return a ? a.textContent : name; };

  /* Page titles come from the navigation, so each name is written once. */
  views.forEach(view => {
    const head = view.querySelector('.dx-head'), link = linkOf(view.dataset.view);
    if (!head || head.querySelector('h1') || !link) return;
    const h1 = document.createElement('h1'); h1.textContent = link.textContent; head.prepend(h1);
  });

  /* ── Translation: data-es on prose, the DX_ES dictionary on example text and attributes ── */
  const origText = new WeakMap(), origAttr = new WeakMap(), origHtml = new Map();
  const ATTRS = ['placeholder', 'aria-label', 'title', 'data-tip', 'data-toast', 'data-desc', 'data-action', 'data-error', 'data-success', 'data-msg', 'data-done'];
  const ATTR_SEL = ATTRS.map(a => '[' + a + ']').join(',');
  function translate(scope, to) {
    const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT), nodes = [];
    for (let n = walker.nextNode(); n; n = walker.nextNode()) nodes.push(n);
    nodes.forEach(n => {
      const p = n.parentElement;
      if (!p || p.closest('script, style, .dx-code, [lang="ar"]')) return;
      if (to === 'es') {
        const key = n.nodeValue.trim();
        if (key && ES[key] && !origText.has(n)) { origText.set(n, n.nodeValue); n.nodeValue = n.nodeValue.replace(key, () => ES[key]); }
      } else if (origText.has(n)) { n.nodeValue = origText.get(n); origText.delete(n); }
    });
    $$(ATTR_SEL, scope).forEach(el => {
      const saved = origAttr.get(el) || {};
      ATTRS.forEach(a => {
        if (!el.hasAttribute(a)) return;
        if (to === 'es') { const v = el.getAttribute(a); if (ES[v] && !(a in saved)) { saved[a] = v; el.setAttribute(a, ES[v]); } }
        else if (a in saved) { el.setAttribute(a, saved[a]); delete saved[a]; }
      });
      origAttr.set(el, saved);
    });
  }

  /* ── Code tabs built from the markup itself ── */
  function dedent(source) {
    const lines = source.replace(/^\s*\n/, '').replace(/\s+$/, '').split('\n');
    const pad = lines[0].match(/^ */)[0].length, strip = new RegExp('^ {0,' + pad + '}');
    return lines.map(l => l.replace(strip, '')).join('\n');
  }
  function copy(text, btn, fallbackEl) {
    const label = btn.textContent;
    const done = () => { btn.textContent = t('copied'); btn.classList.add('done'); setTimeout(() => { btn.textContent = label; btn.classList.remove('done'); }, 1400); };
    const select = () => { if (!fallbackEl) return; const r = document.createRange(); r.selectNodeContents(fallbackEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
    try { navigator.clipboard.writeText(text).then(done, select); } catch (e) { select(); }
  }
  const examples = $$('.dx-ex').map(ex => {
    const view = ex.closest('.dx-view'), name = view.dataset.view, key = ex.dataset.css || name;
    const stage = ex.querySelector('.dx-stage'), pristine = stage && stage.cloneNode(true);
    const css = document.querySelector('style[data-css="' + key + '"]');
    const scripts = !stage ? [] : Array.from(new Set(((view.dataset.js || '') + ' ' + name).split(' ').filter(Boolean)))
      .map(n => [n, document.querySelector('script[data-js="' + n + '"]')]).filter(pair => pair[1]);
    const pre = () => { const p = document.createElement('pre'); p.className = 'dx-code'; p.tabIndex = 0; return p; };
    const panes = [];
    let htmlPre = null, cssPre = null;
    if (stage) { panes.push(['', stage]); htmlPre = pre(); panes.push(['HTML', htmlPre]); }
    if (css) { cssPre = pre(); panes.push(['CSS', cssPre]); }
    if (scripts.length) {
      const p = pre();
      p.textContent = scripts.map(([n, s]) => (scripts.length > 1 ? '/* ── ' + n + ' ── */\n' : '') + dedent(s.textContent)).join('\n\n');
      panes.push(['JS', p]);
    }
    const bar = document.createElement('div'); bar.className = 'dx-bar';
    const show = i => panes.forEach(([, el], n) => { el.hidden = n !== i; bar.children[n].setAttribute('aria-pressed', n === i); });
    panes.forEach(([label, el], i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'dx-tab'; b.textContent = label;
      b.addEventListener('click', () => show(i)); bar.append(b);
      if (el !== stage) ex.append(el);
    });
    const copyBtn = document.createElement('button'); copyBtn.type = 'button'; copyBtn.className = 'dx-copy';
    copyBtn.addEventListener('click', () => {
      let i = panes.findIndex(([, el]) => !el.hidden);
      if (panes[i][1] === stage) { i += 1; show(i); }
      copy(panes[i][1].textContent, copyBtn, panes[i][1]);
    });
    bar.append(copyBtn); ex.prepend(bar); show(0);
    return function refresh() {
      if (htmlPre) { const clone = pristine.cloneNode(true); if (lang === 'es') translate(clone, 'es'); htmlPre.textContent = dedent(clone.innerHTML).replace(/=""/g, ''); }
      if (cssPre) {
        const needs = key === name ? (view.dataset.needs || '').split(' ').filter(Boolean).map(labelOf) : [];
        cssPre.textContent = (needs.length ? '/* ' + t('uses') + ': ' + needs.join(', ') + ' */\n\n' : '') + dedent(css.textContent);
      }
      if (stage) bar.children[0].textContent = t('preview');
      copyBtn.textContent = t('copy');
    };
  });

  /* ── Component index on the introduction ── */
  const index = document.getElementById('dx-index');
  $$('.dx-group', rail).slice(1).forEach(group => {
    const title = document.createElement('div'); title.className = 'dx-eyebrow'; title.textContent = group.querySelector('span').textContent;
    const grid = document.createElement('div'); grid.className = 'dx-index';
    $$('a', group).forEach(a => { const link = document.createElement('a'); link.href = a.hash; link.textContent = a.textContent; grid.append(link); });
    index.append(title, grid);
  });
  index.style.cssText = 'display:flex;flex-direction:column;gap:10px';

  /* ── Color swatches ── */
  const SW = {
    base: [['paper', '#F0EFEB', '#292929', 'Page background', 'Fondo general'], ['panel', '#FFFFFF', '#323130', 'Cards and panels', 'Tarjetas y paneles'], ['inset', '#E6E5E0', '#3A3937', 'Sunken areas', 'Fondos hundidos'], ['line', '#D5D4CF', '#3E3D3B', 'Soft borders', 'Bordes suaves'], ['rule', '#92918D', '#605F5B', 'Strong borders', 'Bordes fuertes'], ['ink', '#292929', '#F0EFEB', 'Main text', 'Texto principal'], ['steel', '#92918D', '#A3A29D', 'Secondary; not for small text', 'Secundario; no para texto pequeño'], ['signal', '#F36B32', '#F36B32', 'Accent: live and primary', 'Acento: lo vivo y lo primario'], ['signal-soft', '#F9D9CA', '#5A3A2A', 'Halo and accent ground', 'Halo y fondo del acento'], ['on-signal', '#2A1608', '#2A1608', 'Text on the accent', 'Texto sobre el acento'], ['ok', '#46857A', '#6FB3A4', 'Positive states', 'Estados positivos']],
    status: [['sev-critical', '#BE3A2B', '#D85A49', 'Error, destructive', 'Error, destructivo'], ['sev-high', '#F36B32', '#F36B32', 'High (same as signal)', 'Alto (igual que signal)'], ['sev-medium', '#D99A3C', '#E0A94E', 'Warning, paused', 'Advertencia, en pausa'], ['sev-low', '#5E8A86', '#6FA39E', 'Low, informative', 'Bajo, informativo'], ['sev-info', '#92918D', '#A3A29D', 'Neutral', 'Neutro']],
    cat: [['c-blue', '#2F5D8A', '#7BA3CC', 'Series, secondary links', 'Series, enlaces secundarios'], ['c-yellow', '#E8B629', '#EBC550', 'Highlight; fill only in light', 'Resaltado; solo relleno en claro'], ['c-green', '#4F7F3A', '#8DB476', 'Positive series', 'Series positivas'], ['c-brown', '#6B4F3A', '#B8977A', 'Neutral groups', 'Agrupaciones neutras'], ['c-teal', '#5E8A86', '#6FA39E', 'Secondary series', 'Series secundarias']],
    text: [['steel-text', '#6E6D69', '#A3A29D', 'Readable secondary text', 'Texto secundario legible'], ['signal-text', '#B8481A', '#F36B32', 'Orange as text', 'Naranja como texto'], ['ok-text', '#3E6E6A', '#6FB3A4', 'Positive as text', 'Positivo como texto'], ['medium-text', '#7A5A00', '#E0A94E', 'Warning as text', 'Advertencia como texto']]
  };
  function buildSwatches() {
    $$('[data-sw]').forEach(box => {
      box.textContent = '';
      SW[box.dataset.sw].forEach(([name, light, dark, en, es]) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'dx-sw'; b.title = t('copyVar') + ' var(--' + name + ')';
        b.innerHTML = '<i style="background: var(--' + name + ')"></i><div><b>--' + name + '</b><span>' + t('lightVal') + ' ' + light + '</span><span>' + t('darkVal') + ' ' + dark + '</span><em>' + (lang === 'es' ? es : en) + '</em></div>';
        b.addEventListener('click', () => { const label = b.querySelector('b'); copy('var(--' + name + ')', label, label); });
        box.append(b);
      });
    });
  }

  /* ── Routes ── */
  function route(scroll) {
    const hash = location.hash.slice(1);
    const view = views.find(v => v.dataset.view === hash) || views[0];
    views.forEach(v => { v.hidden = v !== view; });
    const i = links.findIndex(a => a.hash === '#' + view.dataset.view);
    links.forEach((a, n) => { if (n === i) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    scale.style.setProperty('--pos', links.length > 1 ? i / (links.length - 1) : 0);
    const prev = links[i - 1], next = links[i + 1];
    pager.textContent = '';
    [[prev, 'prev', ''], [next, 'next', 'next']].forEach(([link, key, cls]) => {
      if (!link) return;
      const a = document.createElement('a'), small = document.createElement('small');
      a.href = link.hash; a.className = cls; small.textContent = t(key); a.append(small, link.textContent); pager.append(a);
    });
    $$('dialog[open]').forEach(d => d.close());
    $$('.pop:not([hidden])').forEach(p => { p.hidden = true; });
    rail.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false');
    if (scroll !== false) {
      window.scrollTo(0, 0);
      if (links[i] && rail.scrollHeight > rail.clientHeight) rail.scrollTop = links[i].offsetTop - rail.clientHeight / 2;
    }
  }

  /* ── Language ── */
  function setLang(next) {
    lang = next; root.lang = lang;
    try { localStorage.setItem('dx-lang', lang); } catch (e) {}
    $$('[data-es]').forEach(el => {
      if (!origHtml.has(el)) origHtml.set(el, el.innerHTML);
      el.innerHTML = lang === 'es' ? el.dataset.es : origHtml.get(el);
    });
    translate(document.body, lang);
    $$('.dx-lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
    examples.forEach(refresh => refresh());
    buildSwatches(); paintTheme(); route(false);
  }
  $$('.dx-lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  /* ── Search and the mobile menu ── */
  document.getElementById('dx-search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    $$('.dx-group', rail).forEach(group => {
      let any = false;
      $$('a', group).forEach(a => { const ok = !q || a.textContent.toLowerCase().includes(q) || a.hash.includes(q); a.hidden = !ok; any = any || ok; });
      group.hidden = !any;
    });
    if (q) { rail.classList.add('open'); menuBtn.setAttribute('aria-expanded', 'true'); }
  });
  menuBtn.addEventListener('click', () => menuBtn.setAttribute('aria-expanded', rail.classList.toggle('open')));

  /* ── Theme ── */
  const themeBtn = document.getElementById('dx-theme');
  if (!root.dataset.theme) root.dataset.theme = 'light';  /* light by default; the button switches */
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  function paintTheme() { themeBtn.textContent = isDark() ? t('light') : t('dark'); }
  themeBtn.addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; paintTheme(); });
  new MutationObserver(paintTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);

  addEventListener('hashchange', () => route());
  setLang(lang);
  route();
})();
</script>
